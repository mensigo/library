name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout images repo
        uses: actions/checkout@v4
        with:
          repository: mensigo/library_static
          path: images_repo
          fetch-depth: 1
          ssh-key: ${{ secrets.IMAGES_SSH_KEY }}

      - name: Sync images
        run: |
          rm -rf src/images/notes src/images/reviews
          mkdir -p src/images/notes src/images/reviews
          rsync -a --delete --exclude 'logo.png' images_repo/src/images/ src/images/
          rm -rf images_repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: NODE_ENV=production npx eleventy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4